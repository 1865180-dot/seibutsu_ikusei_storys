<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;color:#1f2937;background:linear-gradient(#8fd3ff,#eaf8ff 55%,#8fd06a 55%,#6fb04a);display:flex;align-items:center;justify-content:center;padding:24px}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
a.card{display:flex;flex-direction:column;background:#fffdf7;border-radius:22px;overflow:hidden;text-decoration:none;color:inherit;border:5px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.16);transition:transform .12s}
a.card:hover,a.card:focus-visible{transform:translateY(-6px);outline:none;border-color:#f59e0b}
.pic{aspect-ratio:16/10;display:block;width:100%}
.body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.area{font-size:14px;font-weight:900;color:#fff;border-radius:999px;padding:2px 12px;align-self:flex-start}
.card h2{margin:2px 0 0;font-size:28px;font-weight:900}
.card p{margin:0;font-size:16px;line-height:1.6;font-weight:500;flex:1}
.go{margin-top:8px;text-align:center;background:#f59e0b;color:#fff;font-weight:900;font-size:20px;border-radius:14px;padding:8px;box-shadow:0 4px 0 #b45309}

@media(max-width:800px){.cards{grid-template-columns:1fr}}
</style>
</head>
