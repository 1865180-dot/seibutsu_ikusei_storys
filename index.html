<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>道の駅の名物づくり 〜ミニトマト編〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0f172a;overflow:hidden;font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','BIZ UDPGothic','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;color:#1f2937}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid #facc15;outline-offset:2px}
#viewport{position:fixed;inset:0}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;overflow:hidden;background:#cfeaff;user-select:none;-webkit-user-select:none}
#bg,#chars,#fx,#ui,#hud,#dlg,#teacher{position:absolute}
#bg{inset:0}
#bg .layer{position:absolute;inset:0;transition:opacity .7s}
#bg svg,.fig svg{display:block;width:100%;height:100%}
#fx{inset:0;pointer-events:none;overflow:hidden}

/* 人物 */
#chars{inset:0;pointer-events:none}
.slot{position:absolute;bottom:250px;width:380px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transition:opacity .45s,transform .45s}
.slot.hidden{opacity:0;transform:translateY(24px)}
.slot .fig{width:170px;height:240px;position:relative;animation:bob 3.4s ease-in-out infinite}
.slot:nth-child(2) .fig{animation-delay:-1.1s}.slot:nth-child(3) .fig{animation-delay:-2.2s}
.slot.dim .fig{filter:grayscale(.9) brightness(.8);opacity:.75}
.nt{margin-top:-8px;color:#fff;font-weight:900;font-size:15px;padding:3px 14px;border-radius:10px;text-align:center;line-height:1.25;position:relative;z-index:2}
.nt small{display:block;font-weight:700;font-size:12px;opacity:.95}
.bubble{width:360px;min-height:56px;max-height:150px;margin-bottom:14px;background:#fff;border:4px solid var(--c);border-radius:20px;padding:9px 15px;font-size:18px;line-height:1.5;font-weight:700;position:relative;opacity:0;transform:translateY(10px) scale(.95);transition:opacity .4s,transform .4s;display:flex;align-items:center}
.bubble.show{opacity:1;transform:none}
.bubble:after{content:"";position:absolute;left:50%;bottom:-16px;margin-left:-12px;border:12px solid transparent;border-top:14px solid var(--c);border-bottom:0}
.bubble:empty{display:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* HUD */
#hud{left:14px;right:14px;top:10px;height:62px;display:none;align-items:center;gap:12px;z-index:5}
.chip{background:#14532d;color:#fff;border-radius:999px;padding:9px 20px;font-size:18px;font-weight:700;white-space:nowrap;max-width:430px;overflow:hidden;text-overflow:ellipsis}
.meters{margin-left:auto;display:flex;gap:12px;background:rgba(255,255,255,.94);border-radius:16px;padding:8px 14px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.m{position:relative;width:170px}
.m .lab{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:3px}
.m .lab b{font-size:16px}
.m .bar{height:13px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.m .bar i{display:block;height:100%;border-radius:999px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.delta{position:absolute;right:0;top:-8px;font-weight:900;font-size:22px;padding:0 8px;border-radius:8px;background:#fff;animation:floatup 2s ease-out forwards;z-index:9;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.delta.good{color:#15803d}.delta.bad{color:#b91c1c}
@keyframes floatup{0%{opacity:0;transform:translateY(8px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.15)}75%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}

/* 会話窓 */
#dlg{left:24px;right:24px;bottom:12px;height:228px;background:rgba(15,23,42,.975);border:4px solid #fff;border-radius:22px;color:#fff;padding:14px 28px;display:none;z-index:6}
.spk{display:inline-block;color:#fff;font-weight:900;font-size:19px;padding:2px 16px;border-radius:10px}
.txt{font-size:24px;line-height:1.65;margin-top:8px;min-height:80px;font-weight:500}
.nx{position:absolute;right:30px;bottom:14px;font-size:26px;color:#fde68a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.go,.big,.btn{background:#fdba74;color:#1f2937;border:0;border-radius:14px;font-weight:900;font-size:20px;padding:10px 28px;min-height:48px;box-shadow:0 4px 0 #c2410c}
.go{position:absolute;right:26px;bottom:14px}
.go:hover,.big:hover,.btn:hover{filter:brightness(1.07)}
.btn.sub{background:#fff;box-shadow:0 4px 0 #94a3b8}
.btn.green{background:#86efac;box-shadow:0 4px 0 #15803d}

/* 選択 */
.prompt{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.prompt b{font-size:20px}
.trade{background:#fef3c7;color:#78350f;border-radius:999px;font-size:15px;font-weight:700;padding:3px 14px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{text-align:left;background:#fff;color:#1f2937;border:4px solid var(--c);border-radius:14px;padding:8px 12px 8px;min-height:118px;font-size:15px;line-height:1.4;position:relative;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px)}
.card.sel{background:var(--soft);box-shadow:0 0 0 5px #facc15;transform:translateY(-4px)}
.card .tg{display:inline-block;background:var(--c);color:#fff;border-radius:7px;padding:0 9px;font-size:13px;font-weight:900;margin-bottom:3px}
.card b{display:block;font-size:17px;line-height:1.35;margin-bottom:2px}
.card small{font-size:14px;color:#374151}
.decide{margin-left:auto}
.decide:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.memo{position:absolute;left:28px;right:210px;bottom:14px;background:#fef9c3;color:#422006;border-radius:12px;padding:8px 14px;font-size:16px;line-height:1.5}
.memo b{color:#b45309}
.note{color:#fca5a5;font-size:18px;margin-top:2px}
.note:before{content:"⚠ "}

/* 画面 */
#ui{inset:0;display:none;z-index:8}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.panel{background:rgba(255,255,255,.98);border-radius:26px;box-shadow:0 10px 40px rgba(0,0,0,.3);padding:26px 38px}
.title-card{text-align:center;width:820px;padding:30px 20px 24px}
.title-card .small{display:inline-block;background:#14532d;color:#fff;border-radius:999px;font-weight:700;padding:5px 20px;font-size:18px}
.title-card h1{margin:12px 0 0;font-size:70px;line-height:1.1;font-weight:900;color:#9a3412;text-shadow:0 4px 0 #fff}
.title-card .sub{font-size:30px;font-weight:900;color:#166534;margin:6px 0 16px}
.title-card .cr{margin-top:14px;font-size:15px;color:#475569}
.form{width:760px}
.form h2{margin:0 0 12px;font-size:30px;color:#9a3412}
.row{display:flex;align-items:center;gap:14px;margin:12px 0;font-size:20px}
.row label{width:150px;font-weight:700}
.row input,.row select,.row textarea{font-size:20px;padding:8px 12px;border:3px solid #94a3b8;border-radius:12px;background:#fff}
.row textarea{width:100%;height:92px;resize:none}
.err{color:#b91c1c;font-weight:700;min-height:26px;font-size:17px}
.rules{width:1040px}
.rules h2{margin:0 0 10px;font-size:32px;color:#14532d}
.rl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px;font-size:19px;line-height:1.55}
.rl .it{background:#f1f5f9;border-radius:14px;padding:8px 14px}
.rl .it b{display:block;font-size:20px}
.mdot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.goal{background:#fef3c7;border-radius:14px;padding:10px 16px;font-size:21px;font-weight:700;color:#78350f;margin:12px 0}
.fail{background:rgba(31,41,55,.82);color:#fff;text-align:center;flex-direction:column;gap:14px}
.fail h2{margin:0;font-size:44px;font-weight:900;max-width:1000px;line-height:1.3}
.fail p{margin:0;font-size:24px;line-height:1.7;max-width:900px}
.stampbox{background:#fef3c7;color:#78350f;font-size:32px;font-weight:900;padding:14px 34px;border-radius:16px;border:5px solid #b91c1c;transform:rotate(-2deg);animation:slam .7s .5s both}
@keyframes slam{0%{opacity:0;transform:scale(2.4) rotate(-8deg)}70%{opacity:1;transform:scale(.95) rotate(-2deg)}100%{opacity:1;transform:scale(1) rotate(-2deg)}}
.end{width:1196px;height:660px;display:flex;flex-direction:column;gap:12px}
.end-top{display:flex;gap:26px;align-items:center}
.stamp{flex:none;width:170px;height:170px;border-radius:50%;border:8px solid;display:flex;align-items:center;justify-content:center;font-size:110px;font-weight:900;background:#fff;animation:slam .8s .3s both}
.g-S{color:#b91c1c;border-color:#b91c1c}.g-A{color:#c2410c;border-color:#c2410c}.g-B{color:#1d4ed8;border-color:#1d4ed8}.g-C{color:#15803d;border-color:#15803d}.g-D{color:#475569;border-color:#475569}
.end .kicker{font-size:18px;font-weight:700;color:#78350f}
.end h2{margin:0;font-size:38px;font-weight:900;color:#9a3412;line-height:1.25}
.end p{margin:6px 0 0;font-size:20px;line-height:1.65}
.end-mid{display:grid;grid-template-columns:300px 1fr 340px;gap:16px;flex:1;min-height:0}
.box{background:#f8fafc;border-radius:16px;padding:10px 14px}
.box h3{margin:0 0 6px;font-size:18px;color:#334155}
.voice{display:flex;gap:8px;align-items:flex-start;margin:7px 0;font-size:17px;line-height:1.45}
.voice i{flex:none;font-style:normal;font-weight:900;font-size:13px;color:#fff;background:#64748b;border-radius:8px;padding:1px 8px;margin-top:2px}
.emeter{margin:7px 0;font-size:17px;font-weight:700}
.emeter .bar{height:16px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:2px}
.emeter .bar i{display:block;height:100%;border-radius:999px}
.radnote{font-size:15px;text-align:center;color:#475569}
.summary{display:grid;grid-template-columns:1fr;gap:4px;font-size:16px}
.summary .sr{display:flex;gap:8px;align-items:center}
.tagsm{flex:none;font-size:12px;font-weight:900;color:#fff;border-radius:6px;padding:0 7px}
.reflect{width:1180px;height:660px;display:grid;grid-template-columns:330px 1fr;gap:22px}
.reflect h2{margin:0 0 8px;font-size:28px;color:#9a3412}
.reflect .q{margin:6px 0;font-size:18px;font-weight:700}
.reflect textarea,.reflect select{width:100%;font-size:19px;padding:6px 10px;border:3px solid #94a3b8;border-radius:12px;background:#fff}
.reflect textarea{height:74px;resize:none}
.likert{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.likert button{background:#fff;border:3px solid #94a3b8;border-radius:12px;font-size:17px;font-weight:700;padding:8px 4px;min-height:46px}
.likert button.on{background:#fde68a;border-color:#b45309}
.copybox{width:100%;height:130px;font-size:14px;border:2px solid #94a3b8;border-radius:10px;padding:6px}
.confetti{position:absolute;top:-30px;width:14px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(800px) rotate(720deg);opacity:.9}}
#teacher{left:6px;top:78px;z-index:30;display:none;background:rgba(255,255,255,.92);border-radius:10px;padding:6px 8px;font-size:12px;gap:4px;flex-wrap:wrap;width:330px}
#teacher button{font-size:12px;padding:3px 7px;border-radius:6px;border:1px solid #64748b;background:#fff}
@media (prefers-reduced-motion:reduce){.slot .fig{animation:none}.nx{animation:none}}

/* 資料カード */
.matwrap{background:rgba(15,23,42,.55)}
.matpanel{width:1200px;max-height:690px;padding:18px 26px}
.matpanel h2{margin:0 0 10px;font-size:28px;color:#14532d}
.mats{display:flex;gap:16px;align-items:stretch;margin-bottom:12px}
.mat{flex:1;margin:0;background:#f1f5f9;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.mat.wide{flex:1.7}
.mat.wide .pic{aspect-ratio:auto;height:400px}
.mat .pic{aspect-ratio:520/330;max-height:400px;background:#eef2f6;display:flex;align-items:center;justify-content:center}
.mat .pic img{width:100%;height:100%;object-fit:cover;display:block}
.mat .pic svg{width:100%;height:100%;display:block}
.mat figcaption{padding:8px 12px 10px;font-size:17px;line-height:1.5;font-weight:500}
.mat figcaption small{display:block;font-size:12px;color:#64748b;margin-top:2px}
.matbtn{margin-left:auto;font-size:16px;padding:6px 16px;min-height:44px}
.matbtn + .decide{margin-left:0}

</style>
</head>
<body>
<div id="viewport"><div id="stage">
<div id="bg"></div><div id="chars"></div><div id="hud"></div><div id="dlg"></div><div id="ui"></div><div id="fx"></div><div id="teacher"></div>
</div></div>
<script>
/* ===== データと得点のしくみ（画面に依存しない部分） ===== */
const CONFIG = {
  SUBMIT_URL: 'https://script.google.com/a/macros/fuku-c.ed.jp/s/AKfycbz1UhknPTwIbp4X1SKVapY20HcQvc-wqbvM9AIvK74_iN1PgoVwjJ_uuVfBCLwdLgKkLQ/exec', // 生物育成シミュレーターと同じ提出先（空にすると「コピー」方式）
  PHOTO_DIR: 'photos/',      // ここに写真を置くと、資料カードの図が写真に替わる
  PHOTO_CREDITS: {},         // 例：{ aburamushi: '撮影：○○' }
  CLASSES: [1, 2, 3, 4, 5, 6, 7, 8],
  MAX_NUM: 40,
  CREDIT: '© Irie Kanji',
  VERSION: '1.0'
};

const WHO = {
  boss:  { name: '社長',   full: '社長',         color: '#C2410C', dark: '#9A3412', soft: '#FFEDD5', tag: '安く・多く・早く' },
  craft: { name: '職人',   full: '職人の匠さん', color: '#1D4ED8', dark: '#1E3A8A', soft: '#DBEAFE', tag: '品質とおいしさ' },
  sci:   { name: '研究者', full: '研究者の緑川さん', color: '#15803D', dark: '#14532D', soft: '#DCFCE7', tag: '環境と生き物の健康' }
};

const START = { y: 50, q: 50, c: 30, e: 50 };

const METERS = [
  { k: 'y', label: '収量',        color: '#B45309', help: 'どれだけたくさんとれたか' },
  { k: 'q', label: '品質',        color: '#1D4ED8', help: 'おいしさ・見た目・安全' },
  { k: 'c', label: 'コスト',      color: '#6B7280', help: 'かかったお金と手間（小さいほどよい）' },
  { k: 'e', label: '環境・生き物', color: '#15803D', help: '土・水・虫や生き物への影響' }
];

const NEUTRAL = {
  boss:  ['ふむ…まあ悪くはないな。', 'なるほど、そう来たか。', '次の場面に期待だな。'],
  craft: ['ふむ、そういう道もあるか。', '悪くない。だが油断はできんぞ。', 'まあ、様子を見ようじゃないか。'],
  sci:   ['なるほど、一つの考え方ですね。', '結果を見て、また考えましょう。', '良い面と気になる面、どちらもありますね。']
};
const CHOSEN_GOOD = {
  boss: ['よし、わかってくれたか！'], craft: ['うむ、いい判断だ。'], sci: ['ありがとう。きっとうまくいきます。']
};
const CHOSEN_BAD = {
  boss: ['ううむ…思ったほどうまくいかんぞ。'], craft: ['むむ…読みが外れたか。'], sci: ['おや…予想と少し違いましたね。']
};

/* ---------- ステージ1（社長だけの意見で進めて失敗） ---------- */
const STAGE1 = [
  { bg: { kind: 'nursery' }, talk: '「苗はいちばん安いやつを、ぎっしり植えるぞ！株と株の間なんて、せまくていい！」',
    result: '安い苗が、畑にびっしりと並んだ。仕入れ代は大きく下がった！', d: { y: 8, q: 0, c: -8, e: -3 } },
  { bg: { kind: 'bugs' }, talk: '「虫が出る前に、毎週ぜんぶに農薬をまけ！同じ薬でいい、いちばん安いやつだ！」',
    result: '農薬を毎週まいた。虫は減った。…でも、ハチやテントウムシの姿も見えなくなった。', d: { y: 3, q: -4, c: 4, e: -12 } },
  { bg: { kind: 'house', mode: 'normal' }, talk: '「水も肥料も、たっぷりやれ！多ければ多いほど、よく育つに決まってる！」',
    result: '水と肥料をたっぷり与えた。葉はぐんぐんしげった。…ようすが、少しおかしい？', d: { y: 4, q: -6, c: 4, e: -8 } }
];
const STAGE1_FAIL = {
  title: 'トマトが、ほとんど出荷できない…',
  text: '苗がぎっしりで風が通らず、病気が一気に広がった。同じ農薬をくり返したせいで、虫に薬が効かなくなり、肥料のやりすぎで根も傷んでいた。',
  to: { y: 14, q: 10, c: 62, e: 6 }
};

/* ---------- ステージ2：10の場面 ---------- */
const SCENES = [
  {
    id: 's1', title: '品種えらび', bg: { kind: 'nursery' }, trade: '生産量がふえた ⇔ コスト・環境問題',
    intro: 'まずは苗えらび。苗売り場に、3種類の苗がならんでいる。',
    talk: {
      boss: '「いちばん安い苗にしよう！仕入れが安ければ、たくさん植えて元がとれる！」',
      craft: '「味で選ぶんだ。昔ながらの品種は、甘みがのる。多少とれなくても、そこは譲れん。」',
      sci: '「接ぎ木苗がいいと思います。土の病気に強い根を使うので、農薬を減らせますよ。」'
    },
    ch: {
      boss:  { label: '値段のいちばん安い苗', desc: 'ふつうの苗。たくさん買えるが、土の病気には弱い。', d: { y: 3, q: -3, c: -5, e: -4 },
               result: '安い苗をたくさん仕入れた。仕入れ代はぐっと抑えられた。' },
      craft: { label: '味のよい品種の苗', desc: '甘みの強い品種。実は小さめで、とれる数は少なめ。', d: { y: -3, q: 6, c: 4, e: -1 },
               result: '甘みの強い品種を選んだ。実ができるのが楽しみだ。' },
      sci:   { label: '接ぎ木苗', desc: '病気に強い根につないだ苗。値段は高めだが、農薬を減らしやすい。', d: { y: 4, q: 2, c: 6, e: 4 },
               result: '接ぎ木苗を選んだ。値段は高いが、病気に強い根がついている。' }
    },
    memo: '品種改良は、病気に強い・おいしいなどのよい性質をもつ個体を選んでかけ合わせてきた技術。接ぎ木は、病気に強い根（台木）に別の苗をつなぐ方法。',
    react: {
      boss:  { pos: '仕入れが安く済んだのはいいぞ！', neg: '高い苗だな…元がとれるのか？' },
      craft: { pos: '味のよい苗は、それだけで強みだ。', neg: '味より数か…それでは名物にならん。' },
      sci:   { pos: '病気に強い苗なら、薬も減らせますね。', neg: '病気に弱い苗だと、あとで苦労しますよ。' }
    }
  },
  {
    id: 's2', title: '土づくり', bg: { kind: 'field', tool: 'hoe' }, trade: '手間をへらす ⇔ 土の健康',
    mat: { title: '資料：よい土ってどんな土？', items: [
      { fig: 'danryu', cap: '団粒構造（だんりゅうこうぞう）：土の粒が小さなかたまりになり、すき間に水と空気が入る。根がのびやすい。' },
      { photo: 'taihi', fig: 'taihi', cap: '堆肥（たいひ）：落ち葉・わら・家畜のふんなどを、微生物が分解したもの。土をふかふかにする。' } ] },
    intro: '植える前の土づくり。畑の土を、トマトが育ちやすい状態にしよう。',
    talk: {
      boss: '「土づくりなんて時間のムダだ！耕うん機で浅くザッと耕して、化学肥料をまけばいい。」',
      craft: '「完熟の堆肥をたっぷり入れて、深くまで耕す。ふかふかの土が、うまいトマトをつくるんだ。」',
      sci: '「まず土の状態を調べましょう。堆肥は必要な量だけ入れて、土の中の生き物も大事にしたいです。」'

/* ---------- 得点と結末 ---------- */
const clamp = (v) => Math.max(0, Math.min(100, Math.round(v)));

function newState() {
  return { v: { ...START }, flags: {}, picks: [], logs: [] };
}

function applyChoice(S, sc, key) {
  const ch = sc.ch[key];
  const d = { y: 0, q: 0, c: 0, e: 0, ...ch.d };
  let note = null;
  if (sc.link) {
    const r = sc.link(S.flags, key);
    if (r) { for (const k in r.d) d[k] += r.d[k]; note = r.note; }
  }
  for (const k of ['y', 'q', 'c', 'e']) S.v[k] = clamp(S.v[k] + d[k]);
  S.flags[sc.id] = key;
  S.picks.push(key);
  S.logs.push({ id: sc.id, key, d, note });
  return { d, note };
}

function axes(v) {
  const econ = (v.y + (100 - v.c)) / 2;
  return { econ: Math.round(econ), qual: v.q, env: v.e };
}

function judge(v) {
  const a = axes(v);
  const vals = [a.econ, a.qual, a.env];
  const total = Math.round((a.econ + a.qual + a.env) / 3);
  const bias = Math.max(...vals) - Math.min(...vals);
  const top = a.econ >= a.qual && a.econ >= a.env ? 'econ' : (a.qual >= a.env ? 'qual' : 'env');
  const weak = a.econ <= a.qual && a.econ <= a.env ? 'econ' : (a.qual <= a.env ? 'qual' : 'env');
  let grade = total >= 65 ? 'S' : total >= 61 ? 'A' : total >= 55 ? 'B' : total >= 47 ? 'C' : 'D';
  const order = ['D', 'C', 'B', 'A', 'S'];
  const cap = (g, m) => (order.indexOf(g) > order.indexOf(m) ? m : g);
  if (bias > 40) grade = cap(grade, 'C');
  else if (bias > 25) grade = cap(grade, 'B');
  else if (bias > 12) grade = cap(grade, 'A');
  let type;
  if (total < 47 && bias <= 25) type = 'low';
  else if (bias > 25) type = top;                 // かたより：econ / qual / env
  else if (grade === 'S') type = 'S';
  else if (grade === 'A') type = 'A';
  else type = 'B';
  return { grade, total, bias, type, top, weak, axes: a };
}

function plant(x, y, h, o = {}) {
  const leaf = o.leaf || '#3f9b3a', dark = o.dark || '#2e7d32', sc = o.s || 1;

/* ---- レーダー（かたより）---- */
function radarSVG(a) {
  const cx = 130, cy = 120, R = 90;
  const pt = (ang, v) => { const r = R * v / 100, t = (ang - 90) * Math.PI / 180; return [cx + r * Math.cos(t), cy + r * Math.sin(t)]; };
  const angs = [0, 120, 240], vals = [a.econ, a.qual, a.env];
  const poly = (v) => angs.map((g, i) => pt(g, v[i]).map((n) => n.toFixed(1)).join(',')).join(' ');
  const labs = [['もうけ・量', 130, 22, 'middle'], ['品質', 256, 214, 'end'], ['環境', 4, 214, 'start']];
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 230" role="img" aria-label="もうけ・品質・環境のバランス">`;
  [100, 66, 33].forEach((g) => { s += `<polygon points="${poly([g, g, g])}" fill="none" stroke="#9ca3af" stroke-width="1.5"/>`; });
  angs.forEach((g) => { const p = pt(g, 100); s += `<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#9ca3af"/>`; });
  s += `<polygon points="${poly(vals)}" fill="#f59e0b" fill-opacity=".45" stroke="#b45309" stroke-width="3"/>`;
  vals.forEach((v, i) => { const p = pt(angs[i], v); s += `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#b45309"/>`; });
  labs.forEach(([t, x, y, an], i) => { s += `<text x="${x}" y="${y}" font-size="15" font-weight="700" text-anchor="${an}" fill="#1f2937" font-family="sans-serif">${t} ${vals[i]}</text>`; });
  return s + '</svg>';
}

/* ---- わき芽（葉のつけ根から出る芽）を正確に描く部品 ---- */
function leafArt(x1, y1, x2, y2, sc) {
  const dx = x2 - x1, dy = y2 - y1, ang = Math.atan2(dy, dx) * 180 / Math.PI;
  const L = 58 * sc, Wd = 15 * sc;
  const leaflet = (x, y, a, k, c) => `<path transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a.toFixed(1)}) scale(${k})" d="M0 0 C ${L * .25} ${-Wd * 1.25} ${L * .7} ${-Wd} ${L} 0 C ${L * .7} ${Wd} ${L * .25} ${Wd * 1.25} 0 0 Z" fill="${c}" stroke="#2f6d24" stroke-width="1.5"/><path transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a.toFixed(1)}) scale(${k})" d="M2 0 H ${L * .9}" stroke="#2f6d24" stroke-width="1.2" opacity=".6"/>`;
  let s = `<path d="M${x1} ${y1} Q ${(x1 + x2) / 2} ${(y1 + y2) / 2 + 14 * sc} ${x2} ${y2}" stroke="#4f8f2f" stroke-width="${8 * sc}" fill="none" stroke-linecap="round"/>`;
  [[.42, .8], [.68, .95]].forEach(([t, k]) => {
    const x = x1 + dx * t, y = y1 + dy * t + 7 * sc * (1 - Math.abs(t - .5) * 2);
    s += leaflet(x, y, ang - 62, k, '#4aa23c') + leaflet(x, y, ang + 62, k, '#3f9b3a');
  });
  s += leaflet(x2 - dx * .04, y2 - dy * .04, ang, 1.15, '#4aa23c');
  return s;
}

(function () {
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const stageEl = $('#stage'), bgEl = $('#bg'), charsEl = $('#chars'), hudEl = $('#hud'), dlgEl = $('#dlg'), uiEl = $('#ui'), fxEl = $('#fx');

/* ---------- 状態 ---------- */
let G = null;
function newGame() { return { name: '', cls: '1', num: '1', hist: [], S: null, t0: Date.now(), hard: '', reason: '', trade: '', self: '' }; }
const N = () => (G && G.name ? G.name : 'あなた');

/* ---------- 文字をすこしずつ出す ---------- */
let typer = null;
function stopType() { if (typer) { clearInterval(typer.timer); } typer = null; }
function typeInto(el, text, cb) {
  stopType();
  const chars = Array.from(text); let i = 0;
  el.textContent = '';
  const t = { el, text, cb, done: false, timer: null };
  t.timer = setInterval(() => { i++; el.textContent = chars.slice(0, i).join(''); if (i >= chars.length) finishType(); }, 28);
  typer = t;
}
function finishType() {
  const t = typer; if (!t || t.done) return;
  clearInterval(t.timer); t.el.textContent = t.text; t.done = true;
  if (t.cb) t.cb();
}

/* ---------- 背景 ---------- */
let bgKey = '';
function setBG(kind, o) {
  o = o || {};
  const key = kind + JSON.stringify(o); if (key === bgKey) return; bgKey = key;
  const layer = document.createElement('div'); layer.className = 'layer'; layer.style.opacity = 0;
  layer.innerHTML = bgSVG(kind, o); bgEl.appendChild(layer);
  requestAnimationFrame(() => requestAnimationFrame(() => { layer.style.opacity = 1; }));
  setTimeout(() => { while (bgEl.children.length > 1) bgEl.removeChild(bgEl.firstChild); }, 800);
}

/* ---------- 人物 ---------- */
const POS = { boss: 30, craft: 450, sci: 870 };
const slots = {}, moodCache = {};
function buildChars() {
  charsEl.innerHTML = '';
  ORDER.forEach((w) => {
    const s = document.createElement('div'); s.className = 'slot hidden'; s.style.left = POS[w] + 'px'; s.style.setProperty('--c', WHO[w].color);
    s.innerHTML = '<div class="bubble"></div><div class="fig"></div><div class="nt" style="background:' + WHO[w].color + '">' + WHO[w].full + '<small>' + WHO[w].tag + '</small></div>';
    charsEl.appendChild(s); slots[w] = s; setMood(w, 'normal');
  });
}
function setMood(w, m) { if (moodCache[w] === m && slots[w].querySelector('.fig').firstChild) return; moodCache[w] = m; slots[w].querySelector('.fig').innerHTML = charSVG(w, m); }
function showChars(list) { ORDER.forEach((w) => slots[w].classList.toggle('hidden', list.indexOf(w) < 0)); }
function dimChars(except) { ORDER.forEach((w) => slots[w].classList.toggle('dim', !!except && except.indexOf(w) < 0)); }
function setBubble(w, text, show) { const b = slots[w].querySelector('.bubble'); if (text != null) b.textContent = text; b.classList.toggle('show', !!show); }
function resetChars() { ORDER.forEach((w) => { setMood(w, 'normal'); setBubble(w, '', false); slots[w].classList.remove('dim'); }); }

/* ---------- HUD ---------- */
function showHud(label) {
  hudEl.style.display = 'flex';
  hudEl.innerHTML = '<div class="chip" id="chip">' + label + '</div><div class="meters">' +
    METERS.map((m) => '<div class="m" data-k="' + m.k + '" title="' + m.help + '"><div class="lab"><span>' + m.label + '</span><b>0</b></div><div class="bar"><i style="background:' + m.color + ';width:0"></i></div></div>').join('') + '</div>';
}
function setChip(t) { const c = $('#chip'); if (c) c.textContent = t; }
function setMeters(v, d) {
  METERS.forEach((m) => {
    const el = $('.m[data-k="' + m.k + '"]', hudEl); if (!el) return;
    el.querySelector('b').textContent = v[m.k];
    el.querySelector('i').style.width = v[m.k] + '%';
    const x = d && d[m.k];
    if (x) {
      const good = m.k === 'c' ? x < 0 : x > 0;
      const sp = document.createElement('span'); sp.className = 'delta ' + (good ? 'good' : 'bad');
      sp.textContent = (x > 0 ? '▲+' + x : '▼' + x); el.appendChild(sp);
      setTimeout(() => sp.remove(), 2100);

}

/* ---------- 会話窓 ---------- */
let advance = null, ready = false;
function showDlg(html) { dlgEl.style.display = 'block'; dlgEl.innerHTML = html; }
function hideDlg() { dlgEl.style.display = 'none'; dlgEl.innerHTML = ''; advance = null; ready = false; stopType(); }
function spkTag(spk) {
  if (WHO[spk]) return '<span class="spk" style="background:' + WHO[spk].color + '">' + WHO[spk].full + '</span>';
  if (spk === 'me') return '<span class="spk" style="background:#0f766e">' + esc(N()) + '</span>';
  return '<span class="spk" style="background:#475569">ナレーション</span>';
}
function say(spk, text, next, opt) {
  opt = opt || {};
  showDlg(spkTag(spk) + '<div class="txt"></div><div class="nx" hidden>▼</div>' + (opt.btn ? '<button class="go" hidden>' + opt.btn + '</button>' : ''));
  advance = null; ready = false;
  const t = $('.txt', dlgEl), nx = $('.nx', dlgEl), go = $('.go', dlgEl);
  if (go) go.onclick = () => { go.disabled = true; if (next) next(); };
  typeInto(t, text, () => { ready = true; if (go) { go.hidden = false; go.focus(); } else { nx.hidden = false; advance = next; } });
}
dlgEl.addEventListener('click', (e) => {
  if (e.target.closest('button,select,textarea,input')) return;
  if (typer && !typer.done) { finishType(); return; }
  if (ready && advance) { const f = advance; advance = null; ready = false; f(); }
});
window.addEventListener('keydown', (e) => {
  if ((e.key === ' ' || e.key === 'Enter') && !/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); dlgEl.click(); }
});
function seq(lines, done) {
  let i = 0;
  const step = () => {
    if (i >= lines.length) { if (done) done(); return; }
    const L = lines[i++];
    if (L.show) showChars(L.show);
    if (L.hl !== undefined) dimChars(L.hl);
    if (L.mood) Object.keys(L.mood).forEach((w) => setMood(w, L.mood[w]));
    if (L.bg) setBG(L.bg.kind, L.bg);
    say(L.spk, L.text, step);
  };

}

function stage1() {

  const v = { ...START };

    setBG(b.bg.kind, b.bg); setChip('ステージ1　社長のいうとおり（' + (i + 1) + '/3）');

      setMeters(v, d);
      say('narr', b.result, () => { i++; beat(); });
    }, { btn: '社長の言うとおりにする ▶' });
  };
  beat();
}
function stage1Fail() {
  hideDlg(); setBG('fail');
  const to = STAGE1_FAIL.to;
  setMeters(to);
  setTimeout(() => {
    ui('<div class="screen fail"><div style="font-size:20px;font-weight:700;background:#b91c1c;padding:4px 18px;border-radius:999px">それから3週間…</div><h2>' + STAGE1_FAIL.title + '</h2><p>' + STAGE1_FAIL.text + '</p>' +
       '<div class="stampbox">一つの立場だけで決めると、失敗する。</div><button class="big" id="nx" style="margin-top:6px">つづける ▶</button></div>');
    $('#nx').onclick = () => {
      clearUI(); showChars(ORDER); dimChars(null);
      seq([
        { spk: 'craft', text: '安さばかり見て、トマトそのものを見ていなかったな。', mood: { boss: 'worried', craft: 'angry', sci: 'normal' }, hl: ['craft'] },
        { spk: 'sci', text: '環境と生き物の健康を無視すると、収量もついてこないんです。', hl: ['sci'] },
        { spk: 'boss', text: 'ううむ…。' + N() + 'くん、今度は3人の意見をよく聞いて、くらべて決めてくれ！', hl: ['boss'], mood: { boss: 'worried', craft: 'normal', sci: 'normal' } }
      ], stage2Rules);
    };
    $('#nx').focus();
  }, 1300);
}

/* ---------- ステージ2 ---------- */
function stage2Rules() {
  clearAll(); setBG('station', { mood: 'normal' });
  ui('<div class="screen"><div class="panel rules"><h2>ステージ2　3人の意見をくらべよう</h2>' +
     '<div class="rl"><div class="it"><b>① 3人が意見を言う</b>場面ごとに、社長・職人・研究者が、考えと理由を話します。</div>' +
     '<div class="it"><b>② くらべて、ひとつ選ぶ</b>だれの意見が、どんな良さと問題をもつか考えよう。</div>' +
     '<div class="it"><b>③ メーターが動く</b>選んだ結果で、4つのメーターが変わり、3人の表情も変わります。</div>' +
     '<div class="it"><b>④ 全部で10場面</b>前の選択が、あとの場面に影響することもあります。（全体で約25〜30分）</div></div>' +
     '<div class="rl" style="margin-top:10px">' + METERS.map((m) => '<div class="it"><b><span class="mdot" style="background:' + m.color + '"></span>' + m.label + '</b>' + m.help + '</div>').join('') + '</div>' +
     '<div class="goal">めざすのは、どれか1つにかたよらない「バランスのよい名物づくり」。</div>' +
     '<div style="text-align:right"><button class="big" id="go">場面1へ ▶</button></div></div></div>');
  $('#go').onclick = startRun; $('#go').focus();
}

function startRun() {
  G.S = newState(); G.attemptStart = Date.now();
  clearAll(); showHud('ステージ2'); setMeters(START);
  showChars(ORDER); resetChars();
  runScene(0);
}

function runScene(i) {
  const sc = SCENES[i];
  hideDlg(); setBG(sc.bg.kind, sc.bg); setChip('ステージ2　場面 ' + (i + 1) + ' / 10　' + sc.title);
  showChars(ORDER); resetChars(); dimChars(null);
  say('narr', sc.intro, () => (sc.mat ? showMat(sc, () => talkPhase(i)) : talkPhase(i)));
}

/* ---------- 資料カード（写真があれば写真、なければ図） ---------- */
function showMat(sc, done) {
  const m = sc.mat;
  const items = m.items.map((it, k) => {
    const credit = it.photo && CONFIG.PHOTO_CREDITS[it.photo] ? CONFIG.PHOTO_CREDITS[it.photo] : '';
    const pic = it.photo
      ? '<img alt="" data-k="' + k + '" src="' + CONFIG.PHOTO_DIR + it.photo + '.jpg">'
      : figSVG(it.fig);
    return '<figure class="mat' + (it.wide ? ' wide' : '') + '" data-k="' + k + '"><div class="pic">' + pic + '</div><figcaption>' + it.cap + (credit ? '<small>' + esc(credit) + '</small>' : '') + '</figcaption></figure>';
  }).join('');
  const box = document.createElement('div'); box.className = 'screen matwrap';
  box.innerHTML = '<div class="panel matpanel"><h2>' + m.title + '</h2><div class="mats">' + items + '</div><div style="text-align:right"><button class="big" id="matok">' + (done ? '3人の意見を聞く ▶' : 'とじる') + '</button></div></div>';
  uiEl.style.display = 'block'; uiEl.innerHTML = ''; uiEl.appendChild(box);
  box.querySelectorAll('img').forEach((img) => {
    img.onerror = () => {
      const it = m.items[+img.dataset.k], fg = img.closest('figure');
      if (it.fig) img.parentNode.innerHTML = figSVG(it.fig); else fg.remove();
    };
  });
  $('#matok').onclick = () => { clearUI(); if (done) done(); };
  $('#matok').focus();
}


function talkPhase(i) {
  const sc = SCENES[i];
  ORDER.forEach((w, k) => setTimeout(() => setBubble(w, sc.talk[w], true), 250 + k * 600));
  const keys = ORDER; // 人物の並び（社長・職人・研究者）と同じ順に固定
  let sel = null;
  showDlg('<div class="prompt"><b>3人の意見をくらべて、どうする？</b><span class="trade">トレードオフ：' + sc.trade + '</span>' +
    (sc.mat ? '<button class="btn sub matbtn" id="matb">資料を見る</button>' : '') + '<button class="btn decide" id="dec" disabled>これに決める ▶</button></div><div class="cards">' +
    keys.map((k) => { const c = sc.ch[k]; return '<button class="card" data-k="' + k + '" style="--c:' + WHO[k].color + ';--soft:' + WHO[k].soft + '"><span class="tg">' + WHO[k].name + '案</span><b>' + c.label + '</b><small>' + c.desc + '</small></button>'; }).join('') + '</div>');
  dlgEl.querySelectorAll('.card').forEach((b) => {
    b.onclick = () => {
      sel = b.dataset.k;
      dlgEl.querySelectorAll('.card').forEach((x) => x.classList.toggle('sel', x === b));
      $('#dec').disabled = false;
    };
  });
  if (sc.mat) $('#matb').onclick = () => showMat(sc, null);
  $('#dec').onclick = () => { if (sel) resultPhase(i, sel); };
}

function concern(w, d) { return w === 'boss' ? d.y - d.c : (w === 'craft' ? d.q : d.e); }
function reaction(sc, w, key, d, i) {
  const v = concern(w, d), chosen = w === key;
  if (v >= 4) return { mood: 'happy', text: sc.react[w].pos };
  if (v <= -2) return chosen ? { mood: 'worried', text: CHOSEN_BAD[w][0] } : { mood: w === 'sci' ? 'worried' : 'angry', text: sc.react[w].neg };
  if (chosen) return { mood: 'happy', text: CHOSEN_GOOD[w][0] };
  return { mood: 'normal', text: NEUTRAL[w][i % 3] };
}

function resultPhase(i, key) {
  const sc = SCENES[i];
  const r = applyChoice(G.S, sc, key);
  setMeters(G.S.v, r.d);
  ORDER.forEach((w) => {
    const rc = reaction(sc, w, key, r.d, i);
    setMood(w, rc.mood); setBubble(w, '「' + rc.text + '」', true);
    slots[w].classList.toggle('dim', false);
  });
  const last = i === SCENES.length - 1;
  showDlg(spkTag('narr') + '<div class="txt" style="min-height:50px;font-size:22px"></div>' +
    (r.note ? '<div class="note">' + r.note + '</div>' : '') +
    '<div class="memo"><b>学習メモ</b>　' + sc.memo + '</div><button class="go" hidden>' + (last ? '結果を見る ▶' : 'つぎの場面へ ▶') + '</button>');
  const go = $('.go', dlgEl);
  go.onclick = () => { go.disabled = true; last ? showEnding() : runScene(i + 1); };
  typeInto($('.txt', dlgEl), sc.ch[key].result, () => { go.hidden = false; go.focus(); });
}

/* ---------- エンディング ---------- */
function saveAttempt() {
  const J = judge(G.S.v);
  const rec = { grade: J.grade, total: J.total, bias: J.bias, type: J.type, weak: J.weak, axes: J.axes, v: { ...G.S.v }, picks: G.S.picks.slice(), logs: G.S.logs.slice(), sec: Math.round((Date.now() - (G.attemptStart || G.t0)) / 1000) };
  G.hist.push(rec); return rec;
}
function showEnding(preview) {
  const rec = preview || saveAttempt(); const J = rec; const E = getEnding(J);
  clearAll();
  setBG('station', { mood: (J.grade === 'S' || J.grade === 'A') ? 'good' : (J.grade === 'D' || J.type === 'low' ? 'bad' : 'normal') });
  const a = J.axes;
  const voice = (k, label, val) => '<div class="voice"><i>' + label + '</i><span>「' + (val >= 60 ? VOICES[k].hi : VOICES[k].lo) + '」</span></div>';
  ui('<div class="screen"><div class="panel end">' +
     '<div class="end-top"><div class="stamp g-' + J.grade + '">' + J.grade + '</div><div><div class="kicker">道の駅での評価　（' + esc(N()) + 'のミニトマト／' + G.hist.length + '回目）</div><h2>' + E.title + '</h2><p>' + E.text(esc(N())) + '</p></div></div>' +
     '<div class="end-mid"><div class="box"><h3>お客さんの声</h3>' + voice('econ', 'もうけ・量', a.econ) + voice('qual', '品質', a.qual) + voice('env', '環境', a.env) + '</div>' +
     '<div class="box"><h3>かたよりチェック</h3>' + radarSVG(a) + '<div class="radnote">かたより ' + J.bias + '（小さいほど、バランスがよい）</div></div>' +
     '<div class="box"><h3>4つのメーター</h3>' + METERS.map((m) => '<div class="emeter">' + m.label + '　' + J.v[m.k] + '<div class="bar"><i style="background:' + m.color + ';width:' + J.v[m.k] + '%"></i></div></div>').join('') + '</div></div>' +
     '<div style="text-align:right"><button class="big" id="cm">3人のコメントを聞く ▶</button></div></div></div>');
  if (J.grade === 'S' || J.grade === 'A') confetti();
  $('#cm').onclick = () => endingComments(J, E);
  $('#cm').focus();
}
function endingComments(J, E) {
  clearUI(); fxEl.innerHTML = '';
  const a = J.axes;
  const mood = (v) => (v >= 60 ? 'happy' : (v < 45 ? 'angry' : 'normal'));
  showChars(ORDER); dimChars(null);
  seq([
    { spk: 'boss', text: E.boss, hl: ['boss'], mood: { boss: mood(a.econ), craft: mood(a.qual), sci: mood(a.env) } },
    { spk: 'craft', text: E.craft, hl: ['craft'] },
    { spk: 'sci', text: E.sci, hl: ['sci'] },
    { spk: 'narr', text: E.lesson, hl: ORDER }
  ], endingChoices);
}
function endingChoices() {
  showDlg(spkTag('narr') + '<div class="txt" style="min-height:70px">どうしますか？　もう一度ちがう選び方を試すこともできます。</div>' +
    '<div style="position:absolute;left:28px;right:28px;bottom:16px;display:flex;gap:16px"><button class="btn green" id="rf" style="flex:1">ふりかえりを書いて、記録を送る ▶</button><button class="btn sub" id="rt" style="flex:1">ステージ2からやりなおす</button></div>');
  $('#rf').onclick = screenReflect; $('#rt').onclick = () => { stage2Retry(); };
  $('#rf').focus();
}
function stage2Retry() {
  clearAll(); setBG('station', { mood: 'normal' });
  showChars(ORDER);
  say('narr', 'もう一度、ステージ2から。前とちがう選び方をすると、結果はどう変わるだろう？', startRun);
}

/* ---------- ふりかえり・提出 ---------- */
function pickTag(k) { return '<span class="tagsm" style="background:' + WHO[k].color + '">' + WHO[k].name + '案</span>'; }
function screenReflect() {
  clearAll(); setBG('station', { mood: 'normal' });
  const last = G.hist[G.hist.length - 1];
  const rows = SCENES.map((sc, i) => '<div class="sr">' + pickTag(last.picks[i]) + '<span>' + (i + 1) + '. ' + sc.title + '</span></div>').join('');
  const sel = G.hard || '';
  ui('<div class="screen"><div class="panel reflect"><div><h2>あなたの選択</h2><div class="summary">' + rows + '</div>' +
     '<p style="font-size:15px;margin:10px 0 0">最後の評価：<b>' + last.grade + '</b>　かたより：' + last.bias + '　挑戦' + G.hist.length + '回目</p></div>' +
     '<div><h2>ふりかえり</h2>' +
     '<div class="q">① いちばん迷った場面は？</div><select id="hard"><option value="">えらんでください</option>' + SCENES.map((sc, i) => '<option value="' + (i + 1) + '. ' + sc.title + '"' + (sel === (i + 1) + '. ' + sc.title ? ' selected' : '') + '>' + (i + 1) + '. ' + sc.title + '</option>').join('') + '</select>' +
     '<div class="q">② その場面で、なぜ迷い、なぜそれを選びましたか？</div><textarea id="reason">' + esc(G.reason) + '</textarea>' +
     '<div class="q">③ 「トレードオフ」とは何か、このゲームの例をあげて説明しよう。</div><textarea id="trade">' + esc(G.trade) + '</textarea>' +
     '<div class="q">④ 意見のちがう3人の考えを、くらべて決められましたか？</div><div class="likert" id="lk">' +
     ['とてもできた', 'だいたいできた', 'あまりできなかった', 'できなかった'].map((t) => '<button type="button" data-v="' + t + '"' + (G.self === t ? ' class="on"' : '') + '>' + t + '</button>').join('') + '</div>' +
     '<div class="err" id="err"></div>' +
     '<div style="display:flex;gap:14px;justify-content:flex-end"><button class="btn sub" id="bk">もどる</button><button class="btn green" id="sd">記録を送る ▶</button></div></div></div></div>');
  $('#lk').querySelectorAll('button').forEach((b) => { b.onclick = () => { G.self = b.dataset.v; $('#lk').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); }; });
  $('#bk').onclick = () => { collect(); clearUI(); showChars(ORDER); endingChoices(); };
  $('#sd').onclick = () => {
    collect();
    if (!G.hard || G.reason.length < 3 || G.trade.length < 3 || !G.self) { $('#err').textContent = '①〜④をすべて入力してください。'; return; }
    submit();
  };
}
function collect() { G.hard = $('#hard').value; G.reason = $('#reason').value.trim(); G.trade = $('#trade').value.trim(); }

function buildPayload() {
  const last = G.hist[G.hist.length - 1];
  const title = getEnding(last).title;
  const pickLabels = last.picks.map((k, i) => (i + 1) + SCENES[i].title + ':' + WHO[k].name).join(' / ');
  const history = G.hist.map((h) => h.grade + '(' + h.total + ')').join(' → ');
  const meters = '収量' + last.v.y + ' 品質' + last.v.q + ' コスト' + last.v.c + ' 環境' + last.v.e;
  return {
    /* 今の提出先（生物育成シミュレーターと同じApps Script）の「記録」シートにそのまま入る項目 */
    kind: '名物づくり', sim: 'ミニトマト（道の駅の名物づくり）', kumi: G.cls, ban: G.num, name: G.name,
    play: G.hist.length, overCount: '', setting: pickLabels, goal: '評価' + last.grade + '「' + title + '」', why: '評価の履歴：' + history,
    turn: '10場面', summary: meters + '／合計' + last.total + '／かたより' + last.bias,
    axes: ['もうけ・量 ' + last.axes.econ, '品質 ' + last.axes.qual, '環境 ' + last.axes.env, 'かたより ' + last.bias], total: '',
    overCause: '', overReflect: '',
    q1: '【迷った場面】' + G.hard + '【理由】' + G.reason, q2: '【トレードオフとは】' + G.trade, q3: '【3人の考えをくらべられたか】' + G.self, q4: '',
    /* 専用シート「名物づくり」用（コード.gs を更新すると、こちらが使われる） */
    ver: CONFIG.VERSION, attempts: G.hist.length, grade: last.grade, ending: title, totalScore: last.total, bias: last.bias,
    y: last.v.y, q: last.v.q, c: last.v.c, e: last.v.e, econ: last.axes.econ, qual: last.axes.qual, env: last.axes.env,
    picks: last.picks.join(','), pickLabels: pickLabels, history: history,
    hard: G.hard, reason: G.reason, trade: G.trade, self: G.self, seconds: last.sec
  };
}
function payloadText(p) {
  return ['【道の駅の名物づくり　記録】', p.kumi + '組' + p.ban + '番　' + p.name, '評価：' + p.grade + '「' + p.ending + '」（合計' + p.totalScore + '／かたより' + p.bias + '）　挑戦' + p.attempts + '回', '履歴：' + p.history,
    'メーター：収量' + p.y + ' 品質' + p.q + ' コスト' + p.c + ' 環境' + p.e, '選択：' + p.pickLabels,
    '①いちばん迷った場面：' + p.hard, '②理由：' + p.reason, '③トレードオフとは：' + p.trade, '④3人の考えをくらべられたか：' + p.self].join('\n');
}
function postForm(url, data) {
  const f = document.createElement('form'); f.method = 'POST'; f.action = url; f.target = '_blank'; f.acceptCharset = 'UTF-8'; f.style.display = 'none';
  const i = document.createElement('input'); i.type = 'hidden'; i.name = 'payload'; i.value = JSON.stringify(data); f.appendChild(i);
  document.body.appendChild(f); f.submit(); setTimeout(() => f.remove(), 1500);
}
function submit() {
  const p = buildPayload();
  let msg;
  if (CONFIG.SUBMIT_URL) {
    postForm(CONFIG.SUBMIT_URL, p);
    msg = '新しいタブで提出画面が開きました。「✅ 提出できました」と表示されたら完了です（そのタブは閉じてかまいません）。<br>ログイン画面が出たときは、学校のアカウントでログインしてから「もう一度送る」を押してください。<br><button class="btn sub" id="resend" style="margin-top:10px">もう一度送る</button>';
  } else {
    msg = '<b style="color:#b91c1c">送信先が未設定です（先生用）。</b>下の文章をコピーして提出してください。<textarea class="copybox" id="cp" readonly>' + esc(payloadText(p)) + '</textarea><button class="btn sub" id="cpb" style="margin-top:6px">コピーする</button>';
  }
  clearUI();
  ui('<div class="screen"><div class="panel form" style="width:880px"><h2>おつかれさま！</h2><div style="font-size:20px;line-height:1.7">' + msg + '</div>' +
     '<div style="display:flex;gap:14px;justify-content:flex-end;margin-top:16px"><button class="btn sub" id="again">ステージ2からもう一度</button><button class="btn" id="home">タイトルへ</button></div></div></div>');
  const rs = $('#resend'); if (rs) rs.onclick = () => postForm(CONFIG.SUBMIT_URL, p);
  const cpb = $('#cpb'); if (cpb) cpb.onclick = () => { const t = $('#cp'); t.select(); try { document.execCommand('copy'); cpb.textContent = 'コピーしました'; } catch (e) { /* 手動でコピー */ } };
  $('#again').onclick = stage2Retry; $('#home').onclick = () => { G = null; screenTitle(); };
}

/* ---------- 先生用（?teacher=1）：すべての結末を確認 ---------- */
function teacherPanel() {
  const t = $('#teacher'); if (!t) return;
  t.style.display = 'flex';
  const preset = {
    '全部社長': Array(10).fill('boss'), '全部職人': Array(10).fill('craft'), '全部研究者': Array(10).fill('sci'),
    'バランス(S)': ['boss', 'sci', 'craft', 'sci', 'craft', 'sci', 'sci', 'sci', 'sci', 'boss'],
    'まぜた(B前後)': ['sci', 'sci', 'craft', 'sci', 'craft', 'sci', 'sci', 'craft', 'boss', 'sci']
  };
  t.innerHTML = '<b style="width:100%">先生用</b><button data-a="s1">ステージ1</button><button data-a="s2">ステージ2</button>' +
    SCENES.map((sc, i) => '<button data-a="sc' + i + '">' + (i + 1) + '</button>').join('') +
    Object.keys(preset).map((k) => '<button data-p="' + k + '">結末:' + k + '</button>').join('');
  t.onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (!G || !G.name) { G = newGame(); G.name = 'テスト'; }
    if (b.dataset.a === 's1') stage1();
    else if (b.dataset.a === 's2') stage2Rules();
    else if (b.dataset.a && b.dataset.a.indexOf('sc') === 0) { const i = +b.dataset.a.slice(2); G.S = newState(); G.attemptStart = Date.now(); clearAll(); showHud('ステージ2'); setMeters(G.S.v); showChars(ORDER); runScene(i); }
    else if (b.dataset.p) { G.S = newState(); G.attemptStart = Date.now(); preset[b.dataset.p].forEach((k, i) => applyChoice(G.S, SCENES[i], k)); showEnding(); }
  };
}

/* ---------- 起動 ---------- */
buildChars();
screenTitle();
if (/[?&]teacher=1/.test(location.search)) teacherPanel();
window.__game = { get G() { return G; }, screenTitle, stage1, showEnding, runScene };
})();

</script>
